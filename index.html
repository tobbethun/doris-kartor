<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Europa-Geografi Åk 7</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        --primary: #ff6b6b;
        --secondary: #4ecdc4;
        --accent: #ffe66d;
        --dark: #2f2f2f;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #fdfdfd;
        overflow: hidden;
      }

      #header {
        background: var(--primary);
        color: white;
        padding: 10px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        position: relative;
        min-height: 60px;
      }

      /* Tillbaka-knappen */
      #back-btn {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid white;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 15px;
        color: white;
        cursor: pointer;
      }

      #map {
        flex-grow: 1;
        width: 100%;
        border-bottom: 5px solid var(--secondary);
      }
      #controls {
        background: white;
        padding: 15px;
        text-align: center;
        z-index: 1000;
      }

      select,
      button {
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 25px;
        border: 2px solid #eee;
        margin: 5px;
        outline: none;
        transition: 0.3s;
      }
      button {
        background: var(--secondary);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
      }
      button:hover {
        transform: scale(1.05);
        background: #3db7af;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--dark);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        color: white;
        flex-direction: column;
        text-align: center;
      }
      .hidden {
        display: none !important;
      }

      #feedback {
        font-weight: bold;
        margin-top: 10px;
        height: 25px;
        font-size: 1.2em;
      }
      .correct {
        color: #2ecc71;
      }
      .wrong {
        color: #e74c3c;
      }
      .cat-btn {
        background: var(--accent);
        color: var(--dark);
        min-width: 220px;
        margin: 10px;
        font-size: 1.1em;
        border: none;
      }

      #stat-bar {
        font-weight: bold;
        background: rgba(255, 255, 255, 0.2);
        display: inline-block;
        padding: 5px 15px;
        border-radius: 15px;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <button id="back-btn" class="hidden" onclick="goBack()">← Meny</button>
      <h2 id="current-task" style="margin: 0">Europakartan 🌍</h2>
      <div id="stat-bar" class="hidden">
        Poäng: <span id="score">0</span> / <span id="total">0</span>
      </div>
    </div>

    <div id="map"></div>

    <div id="controls" class="hidden">
      <p style="margin-top: 0; color: #666">Vilken plats pekar pilen på?</p>
      <select id="name-dropdown">
        <option value="">-- Välj ett svar --</option>
      </select>
      <button onclick="checkAnswer()">Svara!</button>
      <div id="feedback"></div>
    </div>

    <!-- Startmeny -->
    <div id="start-menu" class="overlay">
      <h1 style="font-size: 2.5em; color: var(--accent); margin-bottom: 10px">
        EUROPAS GEOGRAFI
      </h1>
      <p style="margin-bottom: 20px">Välj kategori och träna inför provet!</p>
      <button class="cat-btn" onclick="initGame('Länder')">Länder 🚩</button>
      <button class="cat-btn" onclick="initGame('Huvudstäder')">
        Huvudstäder 🏙️
      </button>
      <button class="cat-btn" onclick="initGame('Bergskedjor')">
        Bergskedjor 🏔️
      </button>
      <button class="cat-btn" onclick="initGame('Hav & Floder')">
        Hav & Floder 🌊
      </button>
    </div>

    <!-- Resultatskärm -->
    <div id="result-screen" class="overlay hidden">
      <h1 style="font-size: 3em">Bra jobbat! 🎉</h1>
      <p id="final-stats" style="font-size: 2em; margin-bottom: 30px"></p>
      <button
        onclick="goBack()"
        style="background: var(--accent); color: black"
      >
        Tillbaka till menyn
      </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // EUROPA-DATA
      const locations = [
        // LÄNDER
        { name: "Sverige", lat: 62.0, lng: 15.0, cat: "Länder" },
        { name: "Norge", lat: 61.0, lng: 8.0, cat: "Länder" },
        { name: "Finland", lat: 64.0, lng: 26.0, cat: "Länder" },
        { name: "Danmark", lat: 56.0, lng: 10.0, cat: "Länder" },
        { name: "Storbritannien", lat: 54.0, lng: -2.0, cat: "Länder" },
        { name: "Irland", lat: 53.4, lng: -7.5, cat: "Länder" },
        { name: "Frankrike", lat: 46.5, lng: 2.5, cat: "Länder" },
        { name: "Tyskland", lat: 51.2, lng: 10.4, cat: "Länder" },
        { name: "Spanien", lat: 40.0, lng: -4.0, cat: "Länder" },
        { name: "Portugal", lat: 39.5, lng: -8.0, cat: "Länder" },
        { name: "Italien", lat: 42.5, lng: 12.5, cat: "Länder" },
        { name: "Grekland", lat: 39.0, lng: 22.0, cat: "Länder" },
        { name: "Polen", lat: 52.0, lng: 19.0, cat: "Länder" },
        { name: "Ukraina", lat: 49.0, lng: 31.0, cat: "Länder" },
        { name: "Rumänien", lat: 46.0, lng: 25.0, cat: "Länder" },
        { name: "Nederländerna", lat: 52.2, lng: 5.3, cat: "Länder" },
        { name: "Schweiz", lat: 46.8, lng: 8.2, cat: "Länder" },
        { name: "Österrike", lat: 47.5, lng: 14.5, cat: "Länder" },

        // HUVUDSTÄDER
        { name: "Stockholm", lat: 59.329, lng: 18.068, cat: "Huvudstäder" },
        { name: "Oslo", lat: 59.913, lng: 10.752, cat: "Huvudstäder" },
        { name: "Helsingfors", lat: 60.169, lng: 24.938, cat: "Huvudstäder" },
        { name: "Köpenhamn", lat: 55.676, lng: 12.568, cat: "Huvudstäder" },
        { name: "London", lat: 51.507, lng: -0.127, cat: "Huvudstäder" },
        { name: "Paris", lat: 48.856, lng: 2.352, cat: "Huvudstäder" },
        { name: "Berlin", lat: 52.52, lng: 13.405, cat: "Huvudstäder" },
        { name: "Madrid", lat: 40.416, lng: -3.703, cat: "Huvudstäder" },
        { name: "Rom", lat: 41.902, lng: 12.496, cat: "Huvudstäder" },
        { name: "Aten", lat: 37.983, lng: 23.727, cat: "Huvudstäder" },
        { name: "Warszawa", lat: 52.229, lng: 21.012, cat: "Huvudstäder" },
        { name: "Kyiv", lat: 50.45, lng: 30.523, cat: "Huvudstäder" },

        // BERGSKEDJOR
        { name: "Alperna", lat: 46.5, lng: 9.5, cat: "Bergskedjor" },
        { name: "Pyrenéerna", lat: 42.6, lng: 1.0, cat: "Bergskedjor" },
        {
          name: "Skanderna (Fjällkedjan)",
          lat: 63.0,
          lng: 13.0,
          cat: "Bergskedjor",
        },
        { name: "Karpaterna", lat: 47.0, lng: 25.0, cat: "Bergskedjor" },
        { name: "Apenninerna", lat: 43.0, lng: 12.5, cat: "Bergskedjor" },
        { name: "Uralbergen", lat: 60.0, lng: 60.0, cat: "Bergskedjor" },

        // HAV & FLODER
        { name: "Östersjön", lat: 57.0, lng: 20.0, cat: "Hav & Floder" },
        { name: "Medelhavet", lat: 35.0, lng: 18.0, cat: "Hav & Floder" },
        { name: "Nordsjön", lat: 56.0, lng: 3.0, cat: "Hav & Floder" },
        { name: "Svarta havet", lat: 43.0, lng: 34.0, cat: "Hav & Floder" },
        { name: "Norska havet", lat: 66.0, lng: 2.0, cat: "Hav & Floder" },
        { name: "Donau", lat: 44.2, lng: 22.4, cat: "Hav & Floder" },
        { name: "Rhen", lat: 50.1, lng: 7.6, cat: "Hav & Floder" },
        { name: "Volga", lat: 53.0, lng: 49.0, cat: "Hav & Floder" },
        { name: "Seine", lat: 48.9, lng: 2.2, cat: "Hav & Floder" },
      ];

      let map, currentCategoryList, currentItem, marker;
      let score = 0;
      let questionIndex = 0;

      // STARTA KARTAN ZOOMAD ÖVER EUROPA
      map = L.map("map", { zoomControl: false }).setView([54, 15], 4);
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png?key=cb1_4qsc_1_57c70a56f2f227aba5db04fe",
        {
          attribution: "&copy; CARTO",
          subdomains: "abcd",
          maxZoom: 20,
        },
      ).addTo(map);

      function initGame(category) {
        currentCategoryList = locations.filter((l) => l.cat === category);
        currentCategoryList.sort(() => Math.random() - 0.5);

        const dropdown = document.getElementById("name-dropdown");
        dropdown.innerHTML = '<option value="">-- Välj ett svar --</option>';

        const sortedNames = [...currentCategoryList].sort((a, b) =>
          a.name.localeCompare(b.name),
        );
        sortedNames.forEach((loc) => {
          const opt = document.createElement("option");
          opt.value = loc.name;
          opt.innerText = loc.name;
          dropdown.appendChild(opt);
        });

        // Visa UI
        document.getElementById("start-menu").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("controls").classList.remove("hidden");
        document.getElementById("stat-bar").classList.remove("hidden");
        document.getElementById("back-btn").classList.remove("hidden");

        score = 0;
        questionIndex = 0;
        document.getElementById("total").innerText = currentCategoryList.length;

        nextQuestion();
      }

      function goBack() {
        // Återställ allt UI
        document.getElementById("start-menu").classList.remove("hidden");
        document.getElementById("controls").classList.add("hidden");
        document.getElementById("stat-bar").classList.add("hidden");
        document.getElementById("back-btn").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");

        // Ta bort markör och nollställ karta över Europa
        if (marker) map.removeLayer(marker);
        map.flyTo([54, 15], 4);
      }

      function nextQuestion() {
        if (questionIndex >= currentCategoryList.length) {
          showResults();
          return;
        }

        currentItem = currentCategoryList[questionIndex];
        document.getElementById("score").innerText = score;
        document.getElementById("feedback").innerText = "";
        document.getElementById("name-dropdown").value = "";

        if (marker) map.removeLayer(marker);
        marker = L.marker([currentItem.lat, currentItem.lng]).addTo(map);

        let zoomLevel = 5;
        if (currentItem.cat === "Huvudstäder") zoomLevel = 6;
        if (
          currentItem.cat === "Hav & Floder" &&
          !currentItem.name.includes("Seine")
        )
          zoomLevel = 4;

        map.flyTo([currentItem.lat, currentItem.lng], zoomLevel);
      }

      function checkAnswer() {
        const selected = document.getElementById("name-dropdown").value;
        const feedback = document.getElementById("feedback");

        if (!selected) return;

        if (selected === currentItem.name) {
          score++;
          feedback.innerText = "Snyggt! Rätt svar! ⭐";
          feedback.className = "correct";
        } else {
          feedback.innerText = "Oj! Det var " + currentItem.name;
          feedback.className = "wrong";
        }

        questionIndex++;
        setTimeout(() => {
          if (
            !document.getElementById("controls").classList.contains("hidden")
          ) {
            nextQuestion();
          }
        }, 1800);
      }

      function showResults() {
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("controls").classList.add("hidden");
        document.getElementById("final-stats").innerText =
          `${score} av ${currentCategoryList.length} rätt!`;
      }
    </script>
  </body>
</html>
