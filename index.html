<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Europas Geografi - Gleerups</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        --primary: #ff6b6b;
        --secondary: #4ecdc4;
        --accent: #ffe66d;
        --dark: #2f2f2f;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: #fdfdfd;
        overflow: hidden;
      }

      #header {
        background: var(--primary);
        color: white;
        padding: 10px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        position: relative;
        min-height: 60px;
      }

      #back-btn {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid white;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 15px;
        color: white;
        cursor: pointer;
      }

      #map {
        flex-grow: 1;
        width: 100%;
        border-bottom: 5px solid var(--secondary);
      }
      #controls {
        background: white;
        padding: 15px;
        text-align: center;
        z-index: 1000;
      }

      select,
      button {
        padding: 12px 20px;
        font-size: 16px;
        border-radius: 25px;
        border: 2px solid #eee;
        margin: 5px;
        outline: none;
        transition: 0.3s;
      }
      button {
        background: var(--secondary);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
      }
      button:hover {
        transform: scale(1.05);
        background: #3db7af;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--dark);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        color: white;
        flex-direction: column;
        text-align: center;
        overflow-y: auto;
        padding: 20px 0;
      }
      .hidden {
        display: none !important;
      }

      #feedback {
        font-weight: bold;
        margin-top: 10px;
        height: 25px;
        font-size: 1.2em;
      }
      .correct {
        color: #2ecc71;
      }
      .wrong {
        color: #e74c3c;
      }
      .cat-btn {
        background: var(--accent);
        color: var(--dark);
        min-width: 260px;
        margin: 8px;
        font-size: 1.1em;
        border: none;
      }

      #stat-bar {
        font-weight: bold;
        background: rgba(255, 255, 255, 0.2);
        display: inline-block;
        padding: 5px 15px;
        border-radius: 15px;
        margin-top: 5px;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <button id="back-btn" class="hidden" onclick="goBack()">← Meny</button>
      <h2 id="current-task" style="margin: 0">Europas Geografi 🌍</h2>
      <div id="stat-bar" class="hidden">
        Poäng: <span id="score">0</span> / <span id="total">0</span>
      </div>
    </div>

    <div id="map"></div>

    <div id="controls" class="hidden">
      <p style="margin-top: 0; color: #666">Vilken plats pekar pilen på?</p>
      <select id="name-dropdown">
        <option value="">-- Välj ett svar --</option>
      </select>
      <button onclick="checkAnswer()">Svara!</button>
      <div id="feedback"></div>
    </div>

      <button class="cat-btn" onclick="initGame('Bergskedjor')">

      </button>
    </div>

      <button
        onclick="goBack()"
        style="background: var(--accent); color: black"
      >
        Tillbaka till menyn
      </button>
    </div>

      let questionIndex = 0;

      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png?key=cb1_4qsc_1_57c70a56f2f227aba5db04fe",
        {
          attribution: "&copy; CARTO",
          subdomains: "abcd",
          maxZoom: 20,
        },
      ).addTo(map);

      function initGame(category) {
        currentCategoryList = locations.filter((l) => l.cat === category);
        currentCategoryList.sort(() => Math.random() - 0.5);

        const dropdown = document.getElementById("name-dropdown");
        dropdown.innerHTML = '<option value="">-- Välj ett svar --</option>';

        const sortedNames = [...currentCategoryList].sort((a, b) =>
          a.name.localeCompare(b.name, "sv", { numeric: true }),
        );
        sortedNames.forEach((loc) => {
          const opt = document.createElement("option");
          opt.value = loc.name;
          opt.innerText = loc.name;
          dropdown.appendChild(opt);
        });

        // Visa UI
        document.getElementById("start-menu").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");
        document.getElementById("controls").classList.remove("hidden");
        document.getElementById("stat-bar").classList.remove("hidden");
        document.getElementById("back-btn").classList.remove("hidden");

        score = 0;
        questionIndex = 0;
        document.getElementById("total").innerText = currentCategoryList.length;

        nextQuestion();
      }

      function goBack() {
        document.getElementById("start-menu").classList.remove("hidden");
        document.getElementById("controls").classList.add("hidden");
        document.getElementById("stat-bar").classList.add("hidden");
        document.getElementById("back-btn").classList.add("hidden");
        document.getElementById("result-screen").classList.add("hidden");

        if (marker) map.removeLayer(marker);
        map.flyTo([54, 15], 4);
      }

      function nextQuestion() {
        if (questionIndex >= currentCategoryList.length) {
          showResults();
          return;
        }

        currentItem = currentCategoryList[questionIndex];
        document.getElementById("score").innerText = score;
        document.getElementById("feedback").innerText = "";
        document.getElementById("name-dropdown").value = "";

        if (marker) map.removeLayer(marker);
        marker = L.marker([currentItem.lat, currentItem.lng]).addTo(map);

        let zoomLevel = 5;
        if (
          currentItem.cat === "Huvudstäder" ||
          currentItem.cat === "Floder" ||
          currentItem.cat === "Öar"
        )
          zoomLevel = 6;
        if (
          currentItem.name.includes("Vatikanstaten") ||
          currentItem.name.includes("San Marino") ||
          currentItem.name.includes("Monaco") ||
          currentItem.name.includes("Andorra") ||
          currentItem.name.includes("Liechtenstein") ||
          currentItem.name.includes("Malta") ||
          currentItem.name.includes("Gibraltarsund") ||
          currentItem.name.includes("Bosporen")
        ) {
          zoomLevel = 8;
        }
        if (currentItem.cat === "Hav & Sjöar" && zoomLevel === 5) zoomLevel = 4;

        map.flyTo([currentItem.lat, currentItem.lng], zoomLevel);
      }

      function checkAnswer() {
        const selected = document.getElementById("name-dropdown").value;
        const feedback = document.getElementById("feedback");

        if (!selected) return;

        if (selected === currentItem.name) {
          score++;
          feedback.innerText = "Snyggt! Rätt svar! ⭐";
          feedback.className = "correct";
        } else {
          feedback.innerText = "Oj! Det var " + currentItem.name;
          feedback.className = "wrong";
        }

        questionIndex++;
        setTimeout(() => {
          if (
            !document.getElementById("controls").classList.contains("hidden")
          ) {
            nextQuestion();
          }
        }, 1800);
      }

      function showResults() {
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("controls").classList.add("hidden");
        document.getElementById("final-stats").innerText =
          `${score} av ${currentCategoryList.length} rätt!`;
      }

</html>
